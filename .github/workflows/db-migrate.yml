# ─────────────────────────────────────────────────────────────────────────────
# Aplica las migraciones pendientes a PRODUCCIÓN cuando se mergea a main.
#
# El agujero que cierra (fase D7 de la auditoría de datos): hasta 2026-07-26 el
# pipeline aplicaba las migraciones SOLO al Postgres efímero de CI, mientras
# Vercel deployaba el código igual. Resultado: código nuevo hablándole a un
# schema viejo. Pasó tres veces —048–051 (caja rota ~10 h), 059/061, y 060–066
# (torneos zafó solo porque su feature flag corta antes de tocar la DB).
#
# Cómo decide qué aplicar: `supabase db push` compara supabase/migrations/
# contra la tabla `supabase_migrations.schema_migrations` de prod. Ese registro
# se reparó el 2026-07-26 para que sus versiones coincidan con los nombres de
# archivo (antes tenía timestamps de cuándo se había aplicado cada una a mano,
# así que un push habría intentado re-aplicar las 66 desde la 001).
#
# Salvaguardas:
#   - `--dry-run` primero: el log deja por escrito qué se va a aplicar ANTES de
#     tocar nada, para poder auditar el incidente si algo sale mal.
#   - Se dispara solo si cambiaron archivos en supabase/migrations/.
#   - concurrency: dos merges seguidos no pushean en paralelo.
#   - Si el push falla, el workflow queda ROJO y GitHub notifica. La app queda
#     con el schema viejo (que es el estado seguro, no uno a medias).
#
# ⚠️ CARRERA CONOCIDA con el deploy de Vercel: Vercel deploya por integración
# Git, no desde este workflow, así que el código nuevo puede quedar arriba unos
# segundos antes de que la migración termine. Por eso las migraciones tienen que
# ser COMPATIBLES HACIA ATRÁS (expand & contract, ver docs/operations/MIGRATIONS.md):
# agregar columna/tabla/índice es seguro; renombrar o dropear algo que el código
# viejo todavía usa NO lo es y va en dos releases.
# ─────────────────────────────────────────────────────────────────────────────

name: DB Migrate (producción)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  # Escotilla manual: re-correr tras arreglar un fallo, o aplicar a mano si el
  # trigger automático no disparó.
  workflow_dispatch:

concurrency:
  group: db-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Aplicar migraciones a producción
    runs-on: ubuntu-latest
    # Si el repo tiene un Environment llamado 'production' con required
    # reviewers, GitHub pide aprobación humana antes de correr este job.
    # Sin ese Environment configurado, corre directo.
    environment: production
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.226.4

      - name: Verificar secrets presentes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ]  && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$SUPABASE_PROJECT_ID" ]   && missing="$missing SUPABASE_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets en el repo:$missing"
            echo "Cargalos en Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Secrets OK."

      - name: Link al proyecto de producción
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Qué se va a aplicar (dry run)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "── Migraciones pendientes en producción ──"
          supabase db push --dry-run

      - name: Aplicar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Verificar que no quedó nada pendiente
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          out="$(supabase db push --dry-run 2>&1)"
          echo "$out"
          # El CLI dice "Remote database is up to date." cuando no queda nada.
          if echo "$out" | grep -qiE "supabase/migrations/[0-9]+"; then
            echo "::error::Quedaron migraciones sin aplicar después del push."
            exit 1
          fi
          echo "Producción al día."
