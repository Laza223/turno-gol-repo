# Configuración de Railway para el servicio de WORKERS de pg-boss.
# La web Next.js NO se deploya acá (va a Vercel) — este servicio solo corre
# el proceso de background jobs 24/7. Ver docs/infraestructura.md.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.worker"

[deploy]
startCommand = "pnpm jobs:start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Segunda mitad de M-5. Railway solo sabía si el proceso RESPIRA, y eso no
# distingue "el worker trabaja" de "el worker está vivo y no puede hablar con la
# base" — que es exactamente lo que pasó el 2026-08-25: arrancó bien, latió cada
# 5 minutos durante horas, y todo `withTenantContext` fallaba.
#
# Con esto Railway consulta `GET /health` (src/shared/jobs/health-server.ts) en
# CADA deploy nuevo y solo lo deja pasar si los dos pools y pg-boss responden.
# Si no, marca el deploy como fallido y **el anterior sigue corriendo**: el modo
# de falla es "el cambio no entra", nunca "producción se cae".
#
# El puerto no se escribe acá y no es un olvido: Railway sondea contra el `PORT`
# que él inyecta, y `healthPort()` usa esa variable cuando existe. Hoy no la
# define, así que el server cae a 8080 —verificado en el deploy 36d836a7:
# `health server listening { port: 8080 }`— que es también el default de
# Railway. Los dos caminos coinciden solos; fijar un número acá los desalinearía
# el día que Railway empiece a inyectarlo.
#
# Sigue siendo un candado de DEPLOY, no un monitor continuo: si el worker se
# muere una hora después, esto no se entera. Ese es P-12 (dead-man's switch),
# que va aparte.
healthcheckPath = "/health"

# Región y réplicas del worker.
#
# ─── Por qué NO dice `region = "..."` ────────────────────────────────────────
#
# Decía exactamente eso, y NO SERVÍA PARA NADA. El 2026-08-26 el archivo pedía
# `us-east4-eqdc4a` y Railway estaba corriendo el worker en **US West**: el
# panel mostraba "US West" y la API devolvía `multiRegionConfig: {sfo: {...}}`.
# O sea que la mudanza que se hizo el 25/8 por latencia nunca ocurrió, y nadie
# se enteró porque un campo que la plataforma ignora no falla: se saltea.
#
# Las claves sueltas `region` y `numReplicas` quedaron viejas; la escala ahora
# se declara con `multiRegionConfig` (docs de Railway, Config as Code →
# Multi-region configuration). Se escriben las dos cosas en la tabla de abajo,
# que es la única forma que la plataforma lee hoy.
#
# ─── Por qué US East ─────────────────────────────────────────────────────────
#
# El default de Railway es US West (California) y la base está en `sa-east-1`
# (São Paulo): ~180-190 ms de ida y vuelta por query. US East (Virginia) es lo
# más cerca que llega Railway —NO tiene región en Sudamérica (consultado a su
# API el 2026-08-25: solo EU West, US West, US East y Sudeste asiático)— y baja
# el viaje a ~115-125 ms.
#
# Es sospechoso principal, además, de los ticks de cron que pg-boss pierde:
# cada operación de su reloj interno paga ese viaje, y el 26/8 se midió que
# pierde el 7,6% de los ciclos de 5 minutos.
#
# 1 réplica con auto-restart alcanza para año 1: pg-boss persiste los jobs en
# Postgres, así que un reinicio los retoma donde quedaron. Subir a 2 para HA.
[deploy.multiRegionConfig.us-east4-eqdc4a]
numReplicas = 1

# Variables de entorno (setear en el dashboard de Railway, NO acá):
#   DATABASE_URL  -> hoy va por el POOLER de Supabase (:6543). El host directo
#                    `db.<ref>.supabase.co` ya no resuelve, así que el comentario
#                    anterior ("conexión DIRECTA, no el pooler") quedó viejo.
#                    El `?sslmode=` del DSN YA NO DECIDE NADA: lo fija el código
#                    en `src/shared/db/ssl.ts`, que además se lo SACA al DSN
#                    antes de dárselo a pg-boss (en node-postgres el DSN le gana
#                    a la opción explícita, así que con solo pasarla no
#                    alcanzaba — corrección del 2026-08-26). Fue a propósito,
#                    después de que
#                    el mismo valor arreglara una librería y rompiera la otra:
#                    `no-verify` dejaba arrancar a pg-boss (node-postgres) y
#                    tiraba abajo todo `withTenantContext` (porsager, que no
#                    entiende ese valor) — el health-ping logueó
#                    `database: down` cada 5 minutos y el proceso seguía vivo,
#                    así que nada avisó. Dejalo como está o sacalo; no cambia
#                    el comportamiento.
#   NODE_ENV=production
#   RESEND_API_KEY, claves de MercadoPago, encryption key de tokens MP,
#   SUPABASE_*, VAPID keys (push), SENTRY_DSN
